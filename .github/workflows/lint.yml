name: Lint

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v7
      with:
        go-version: '1.27'
    - name: Checkout
      uses: actions/checkout@v7

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        args: --timeout 5m
